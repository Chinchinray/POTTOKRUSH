<title>Pottoka Rush</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* Layout: one arcade screen (320x240 canvas scaled up, pixelated) + a strip of controls under it */
:root{
  --bg:#0a0d1c; --bezel:#151a33; --fg:#f4f1ff; --muted:#8d93c2;
  --yellow:#ffd400; --red:#e01c24; --sky:#4fb3ff;
  --pixel:'Press Start 2P', ui-monospace, 'Courier New', monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{
  background:var(--bg); color:var(--fg); font-family:var(--pixel);
  margin:0; box-sizing:border-box; overflow:hidden;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:8px;
  background-image:radial-gradient(ellipse at 50% 40%, #1a2150 0%, var(--bg) 70%);
}
#screen{position:relative; border:4px solid var(--bezel); border-radius:6px; box-shadow:0 0 0 2px #2a3160, 0 20px 60px rgba(0,0,0,.6), 0 0 80px rgba(79,179,255,.12); line-height:0; max-width:100%}
canvas{display:block; image-rendering:pixelated; image-rendering:crisp-edges; touch-action:none; outline:none; max-width:100%}
#screen::after{content:""; position:absolute; inset:0; pointer-events:none; border-radius:2px;
  background:repeating-linear-gradient(0deg, rgba(0,0,0,.16) 0 1px, transparent 1px 3px);
  mix-blend-mode:multiply}
.help{display:flex; flex-wrap:wrap; justify-content:center; gap:8px 18px; font-size:9px; color:var(--muted); line-height:1.6; text-align:center; max-width:100%}
.help span{white-space:nowrap}
kbd{font-family:var(--pixel); font-size:8px; color:var(--fg); background:#232a52; border:1px solid #3a4380; border-bottom-width:3px; border-radius:3px; padding:2px 5px}
@media (max-height:420px){ .help{display:none} }
body{touch-action:manipulation; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent}
body.touch .help span:not(.togwrap){display:none}
#tog{font-family:var(--pixel); font-size:8px; color:var(--fg); background:#232a52; border:1px solid #3a4380; border-bottom-width:3px; border-radius:3px; padding:4px 7px; cursor:pointer}
#tog[aria-pressed="true"]{background:#5a4a00; border-color:var(--yellow); color:var(--yellow)}
#tog:focus-visible{outline:2px solid var(--yellow); outline-offset:2px}
#rotate{display:none; position:fixed; inset:0; z-index:10; background:var(--bg); color:var(--fg); flex-direction:column; align-items:center; justify-content:center; gap:16px; text-align:center;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); font-size:12px; line-height:1.6}
#rotate p{margin:0} #rotate .small{font-size:8px; color:var(--muted)}
#rotate .phone{width:38px; height:64px; border:4px solid var(--yellow); border-radius:7px; animation:turn 2s ease-in-out infinite}
@keyframes turn{0%,25%{transform:rotate(0)} 55%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait){ body.touch:not(.rot-ok) #rotate{display:flex} }
@media (prefers-reduced-motion:reduce){ #rotate .phone{animation:none; transform:rotate(-90deg)} }
#splash{position:absolute; inset:0; z-index:2; background:#000; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2%; cursor:pointer; transition:opacity .6s ease; border-radius:2px}
#splash.out{opacity:0; pointer-events:none}
#splash-logo{height:84%; width:auto; max-width:90%; opacity:0; transform:scale(.96); animation:logoIn 1.1s .15s ease-out forwards}
#splash-hint{margin:0; font-family:var(--pixel); font-size:clamp(7px,1.4vw,11px); color:#b3b3b3; line-height:1; opacity:0; animation:hintIn .4s 1.4s forwards, blink 1s 1.8s steps(2) infinite}
@keyframes logoIn{to{opacity:1; transform:scale(1)}}
@keyframes hintIn{to{opacity:1}}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){ #splash-logo,#splash-hint{animation:none; opacity:1; transform:none} }
</style>

const W=320,H=240;
const cv=document.getElementById('c');
const g=cv.getContext('2d');
g.imageSmoothingEnabled=false;
const FONT='"Press Start 2P", monospace';

function fit(){
  const help=document.getElementById('help');
  const hh=help.offsetParent? help.offsetHeight+18 : 8;
  const tight=window.innerHeight<500;
  const aw=Math.min(window.innerWidth-(tight?36:40), 1400), ah=window.innerHeight-hh-(tight?14:30);
  let s=Math.min(aw/W, ah/H);
  if(s>=2) s=Math.max(2, Math.floor(s*2)/2);
  s=Math.max(1,s);
  cv.style.width=Math.floor(W*s)+'px'; cv.style.height=Math.floor(H*s)+'px';
}

function makeArt(rows,pal,outline){
  const h=rows.length,w=rows[0].length,c=document.createElement('canvas');
  const o=outline?1:0; c.width=w+o*2; c.height=h+o*2; const x=c.getContext('2d');
  if(outline){ x.fillStyle=outline;
    for(let j=0;j<h;j++)for(let i=0;i<w;i++) if(rows[j][i]!=='.') x.fillRect(i,j,3,3);
  }
  for(let j=0;j<h;j++)for(let i=0;i<w;i++){const ch=rows[j][i]; if(ch!=='.'&&pal[ch]){x.fillStyle=pal[ch];x.fillRect(i+o,j+o,1,1);}}
  return c;
}

const RL=[]; // reusable rect list
function drawRunnerTo(c,x,y,sp,phase,o){
  o=o||{}; x=Math.round(x); y=Math.round(y-(o.z||0));
  RL.length=0; const r=(a,b,w,h,col)=>{ if(w>0&&h>0) RL.push(a,b,w,h,col); };
  const Wd=sp.w, hw=Wd>>1, st=o.still?0:Math.sin(phase);
  const lo=Math.round(st*1.8), ro=-lo, arm=o.armsUp?0:Math.round(st*1.4);
  const leg=sp.leg, sh=3, th=sp.th, hs=sp.hs, hd=sp.hd;
  const ys=y-2-leg-sh, yt=ys-th, yh=yt-hs+1, hx=x-(hd>>1);
  const lw=Math.max(2,Math.round(Wd/4));
  const front=o.facing==='down';
  const j1=o.j1||sp.j1, armC=sp.fur?sp.legc:(sp.armC||sp.skin);
  // legs + boots
  const ins=Wd>10?1:0;
  const legs=[[x-hw+ins,Math.max(0,lo)],[x+hw-ins-lw+ (Wd&1?1:0),Math.max(0,ro)]];
  for(const [lx,lift] of legs){
    const top=ys+sh, by=y-2-lift, len=by-top;
    if(sp.fur){ r(lx,top,lw,len,sp.legc); r(lx,by-1,lw,1,sp.sock2); }
    else { r(lx,top,lw,len,sp.skin); const s=Math.min(2,len-1); r(lx,top+s,lw,len-s,sp.sock); r(lx,by-2,lw,1,sp.sock2); }
    r(lx,by,lw+1,2,sp.boot);
  }
  // shorts
  r(x-hw,ys,Wd+(Wd&1?1:0),sh,sp.shorts);
  if(sp.stripes) for(let i=1;i<Wd+(Wd&1?1:0);i+=2) r(x-hw+i,ys,1,sh,sp.stripes);
  // torso
  const tw=Wd+(Wd&1?1:0);
  r(x-hw,yt,tw,th,j1);
  if(sp.j2) r(x-hw,yt+(th>>1)+1,tw,th-(th>>1)-1,sp.j2);
  r(x-hw+tw-1,yt,1,(sp.j2?(th>>1)+1:th),o.j1?j1:sp.j1d);
  if(!sp.fur){
    if(front){ r(x-2,yt,4,1,'#fff'); r(x-1,yt+1,2,1,'#fff'); r(x+hw-3,yt+2,2,2,'#fff'); r(x-hw,yt+th-1,tw,1,'#fff'); }
    else { r(x-1,yt+1,2,th-2,'#fff'); }
  }
  if(sp.tail&&!front) r(x,ys+1,2,5+Math.round(st),sp.hair);
  // arms
  const ax1=x-hw-2, ax2=x-hw+tw;
  if(o.armsUp){
    const top=yh-3, len=yt+2-top;
    r(ax1,top,2,len,armC); r(ax2,top,2,len,armC);
    r(ax1,yt-1,2,3,j1); r(ax2,yt-1,2,3,j1);
    r(ax1-1,top-1,3,2,armC); r(ax2,top-1,3,2,armC);
  } else {
    r(ax1,yt+1+arm,2,th-1,armC); r(ax1,yt+1+arm,2,2,j1); r(ax1,yt+3+arm,2,1,'#fff');
    r(ax2,yt+1-arm,2,th-1,armC); r(ax2,yt+1-arm,2,2,j1); r(ax2,yt+3-arm,2,1,'#fff');
  }
  if(sp.shieldArm){ r(ax1-4,yt+1+arm,6,7,'#f4f4f4'); r(ax1-3,yt+3+arm,4,3,'#e01c24'); r(ax1-2,yt+4+arm,2,1,'#fff'); }
  if(o.bow){ const by=yt+th-1; r(x-6,by,13,1,'#7a4a1a'); r(x-7,by-1,1,1,'#7a4a1a'); r(x+7,by-1,1,1,'#7a4a1a'); r(x-5,by-1,11,1,'#e8e0c8');
    if(o.arrow){ r(x,by-2,1,7,'#8a5a2a'); r(x-1,by+5,3,1,'#cfd3e0'); r(x,by-3,1,1,'#e01c24'); } }
  if(o.ball){ const bx=ax2-2, by=yt+2-arm; r(bx,by,5,4,'#f4f4f4'); r(bx+1,by+1,3,1,'#e01c24'); r(bx+1,by+2,3,1,'#f4f4f4'); }
  if(o.ballUp){ const bx=x-2, by=yh-7; r(bx,by,5,4,'#f4f4f4'); r(bx+1,by+1,3,1,'#e01c24'); }
  // head
  if(sp.kind==='indien'&&front){ const n=Math.ceil((hd+6)/2);
    for(let i=0;i<n;i++){ const fx=hx-3+i*2, cc=Math.abs(i-(n-1)/2), hg=Math.round(7-cc*1.2);
      r(fx,yh-hg,2,hg+3,i%2?'#e01c24':'#f4f4f4'); r(fx,yh-hg,2,1,i%2?'#f4f4f4':'#e01c24'); }
    r(hx-3,yh+2,2,10,'#f4f4f4'); r(hx-3,yh+6,2,2,'#e01c24'); r(hx+hd+1,yh+2,2,10,'#f4f4f4'); r(hx+hd+1,yh+6,2,2,'#e01c24'); }
  if(sp.fur){
    r(hx-1,yh+1,hd+2,hs-3,sp.hair); r(hx,yh,hd,hs,sp.hair); r(hx+2,yh-1,hd-4,1,sp.hair);
    r(hx,yh-2,2,2,sp.hair); r(hx+hd-2,yh-2,2,2,sp.hair);
    if(front){
      r(hx+1,yh+hs-5,hd-2,4,sp.tan); r(hx+2,yh+hs-1,hd-4,1,sp.tan);
      r(hx+1,yh+2,2,2,'#fff'); r(hx+hd-3,yh+2,2,2,'#fff'); r(hx+2,yh+2,1,2,'#111'); r(hx+hd-3,yh+2,1,2,'#111');
      r(hx+3,yh+hs-5,1,1,sp.dark); r(hx+hd-4,yh+hs-5,1,1,sp.dark);
      if(o.open){ r(hx+3,yh+hs-3,hd-6,2,'#7a1020'); r(hx+4,yh+hs-2,hd-8,1,'#e05060'); }
      else r(hx+3,yh+hs-3,hd-6,1,'#3a1a08');
    } else {
      r(hx+1,yh+1,2,1,sp.dark); r(hx+hd-4,yh+2,2,1,sp.dark); r(hx+3,yh+4,3,1,sp.dark); r(hx+1,yh+hs-2,hd-2,1,sp.dark);
      r(hx,yh-1,1,1,sp.tan); r(hx+hd-1,yh-1,1,1,sp.tan);
    }
    if(o.shield){ r(hx-1,yh-2,hd+2,3,'#1c1c28'); r(hx+1,yh-2,3,1,'#45456a'); r(hx+(hd>>1),yh-3,1,1,'#1c1c28'); }
  } else {
    r(hx,yh,hd,hs,sp.skin);
    if(front&&sp.kind==='koxka'){
      r(hx,yh,hd,4,'#d61a22'); r(hx-1,yh+1,1,3,'#d61a22'); r(hx+1,yh-1,hd-2,1,'#d61a22'); r(hx+2,yh,3,1,'#ff5a5a');
      r(hx+hd,yh+2,3,2,'#d61a22'); r(hx+hd+1,yh+4,2,3,'#b01018');
      r(hx-1,yh+5,1,3,sp.skin); r(hx+hd,yh+6,1,2,sp.skin);
      r(hx+1,yh+4,4,1,'#111'); r(hx+hd-5,yh+4,4,1,'#111');
      r(hx+1,yh+5,4,3,'#fff'); r(hx+hd-5,yh+5,4,3,'#fff'); r(hx+3,yh+6,1,2,'#111'); r(hx+hd-4,yh+6,1,2,'#111');
      r(hx+5,yh+7,2,1,'#c08a5a');
      r(hx+3,yh+8,hd-6,2,'#7a1020'); r(hx+5,yh+9,2,1,'#e05060'); r(hx+2,yh+8,1,1,'#7a1020'); r(hx+hd-3,yh+8,1,1,'#7a1020');
    } else if(front){
      if(sp.kind==='indien'){ r(hx,yh,hd,2,'#e01c24'); r(hx+1,yh,1,1,'#fff'); r(hx+hd-2,yh,1,1,'#fff'); r(hx+3,yh+1,2,1,'#ffd400');
        r(hx+1,yh+5,2,1,'#e01c24'); r(hx+1,yh+6,2,1,'#fff'); r(hx+hd-3,yh+5,2,1,'#e01c24'); r(hx+hd-3,yh+6,2,1,'#fff'); }
      if(sp.cap){ r(hx,yh,hd,3,sp.cap); r(hx-1,yh+1,1,4,sp.cap); r(hx+hd,yh+1,1,4,sp.cap); }
      else if(!sp.bald){ r(hx,yh,hd,3,sp.hairc); r(hx+1,yh-1,hd-2,1,sp.hairc); r(hx,yh+3,1,2,sp.hairc); r(hx+hd-1,yh+3,1,2,sp.hairc); }
      if(sp.band) r(hx,yh+2,hd,1,'#ffffff');
      r(hx+1,yh+3,2,1,'#2a160c'); r(hx+hd-3,yh+3,2,1,'#2a160c');
      r(hx+1,yh+4,2,1,'#fff'); r(hx+hd-3,yh+4,2,1,'#fff'); r(hx+2,yh+4,1,1,'#111'); r(hx+hd-3,yh+4,1,1,'#111');
      if(sp.beard){ r(hx,yh+5,1,hs-5,sp.beard); r(hx+hd-1,yh+5,1,hs-5,sp.beard); r(hx+1,yh+hs-2,hd-2,2,sp.beard); }
      r(hx+(hd>>1)-1,yh+hs-2,2,o.open?2:1,'#6a0a14');
    } else {
      if(!sp.bald) r(hx,yh,hd,hs-1,sp.cap||sp.hairc);
    }
  }
  // shadow
  const gy=Math.round(y+(o.z||0));
  c.fillStyle='rgba(0,0,0,0.28)'; c.fillRect(x-hw-2,gy-1,tw+4,2); c.fillRect(x-hw-1,gy-2,tw+2,4);
  // outline pass
  c.fillStyle=o.outline||'#140c08';
  for(let i=0;i<RL.length;i+=5) c.fillRect(RL[i]-1,RL[i+1]-1,RL[i+2]+2,RL[i+3]+2);
  for(let i=0;i<RL.length;i+=5){ c.fillStyle=RL[i+4]; c.fillRect(RL[i],RL[i+1],RL[i+2],RL[i+3]); }
  if(o.tint){ c.fillStyle=o.tint; for(let i=0;i<RL.length;i+=5) c.fillRect(RL[i],RL[i+1],RL[i+2],RL[i+3]); }
}
const OC=document.createElement('canvas'); OC.width=OC.height=48; const oc=OC.getContext('2d');

  g.save(); g.translate(Math.round(x),Math.round(y-(z||0))); g.rotate(ang); g.drawImage(OC,-24,-26); g.restore();
}
const BIG=document.createElement('canvas'); BIG.width=BIG.height=48; const bigc=BIG.getContext('2d');
function drawBig(x,y,sp,phase,o,scale){

  g.drawImage(BIG,0,0,48,48,Math.round(x-24*scale),Math.round(y-44*scale),48*scale,48*scale);

function txt(s,x,y,col,size,align,sh){
  size=size||8; g.font=size+'px '+FONT; g.textBaseline='top'; g.textAlign=align||'left';
  x=Math.round(x); y=Math.round(y);
  if(sh!==false){ g.fillStyle=sh||'#000'; const d=size>=16?2:1;
    g.fillText(s,x+d,y+d); g.fillText(s,x-1,y); g.fillText(s,x+1,y); g.fillText(s,x,y-1); g.fillText(s,x,y+1+ (d-1)); }
  g.fillStyle=col; g.fillText(s,x,y);
}

let AC=null, master, musG, sfxG, crowdG, penaG, noiseBuf, penaBuf=null, penaSrc=null, muted=false;
let seqStep=0, seqNext=0, musicOn=false, tempo=150;
function initAudio(){
  if(AC){ if(AC.state==='suspended'&&!S.paused) AC.resume(); return; }
  try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC=null; return; }
  master=AC.createGain(); master.gain.value=muted?0:0.8; master.connect(AC.destination);
  musG=AC.createGain(); musG.gain.value=0.42; musG.connect(master);
  sfxG=AC.createGain(); sfxG.gain.value=0.7; sfxG.connect(master);
  penaG=AC.createGain(); penaG.gain.value=1.0; penaG.connect(master);
  crowdG=AC.createGain(); crowdG.gain.value=0.0; crowdG.connect(master);
  noiseBuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);
  const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  const src=AC.createBufferSource(); src.buffer=noiseBuf; src.loop=true;
  const bp=AC.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=650; bp.Q.value=0.5;
  const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=1600;
  src.connect(bp).connect(lp).connect(crowdG); src.start();
  try{
    const bin=atob(PENA_B64); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
    AC.decodeAudioData(u.buffer,b=>{penaBuf=b},()=>{});
  }catch(e){}
  seqNext=AC.currentTime+0.1;
  setInterval(scheduler,25);
}
function setPaused(v){ S.paused=v; if(AC){ try{ v?AC.suspend():AC.resume(); }catch(e){} } }
function setMute(m){ muted=m; if(master) master.gain.setTargetAtTime(m?0:0.8,AC.currentTime,0.05); }
const N2F=n=>{ const m=n.match(/^([A-G])(#?)(\d)$/); const b={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]]+(m[2]?1:0); return 440*Math.pow(2,(b+12*(+m[3]+1)-69)/12); };
function tone(f,t,d,type,v,dest,f2){
  if(!AC) return; const o=AC.createOscillator(), gn=AC.createGain();
  o.type=type||'square'; o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+d);
  gn.gain.setValueAtTime(0.0001,t); gn.gain.linearRampToValueAtTime(v||0.1,t+0.005); gn.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(gn).connect(dest||sfxG); o.start(t); o.stop(t+d+0.03);
}
function noise(t,d,v,ff,ft,dest,q){
  if(!AC) return; const s=AC.createBufferSource(); s.buffer=noiseBuf;
  const f=AC.createBiquadFilter(); f.type=ft||'lowpass'; f.frequency.value=ff||3000; if(q) f.Q.value=q;
  const gn=AC.createGain(); gn.gain.setValueAtTime(v,t); gn.gain.exponentialRampToValueAtTime(0.0001,t+d);
  s.connect(f).connect(gn).connect(dest||sfxG); s.start(t,Math.random()*1.5); s.stop(t+d+0.03);
}
// Chiptune: 8 bars A + 4 bars B, eighth-note tokens
const MEL=("G4 B4 D5 B4 C5 E5 D5 B4 A4 C5 B4 G4 A4 - D4 - G4 B4 D5 G5 F#5 D5 E5 C5 B4 G4 A4 F#4 G4 - - - "+
           "G4 B4 D5 B4 C5 E5 D5 B4 A4 C5 B4 G4 A4 - D5 - G5 F#5 E5 D5 C5 B4 A4 F#4 G4 - B4 - G4 - - - "+
           "E5 E5 D5 B4 C5 C5 B4 G4 A4 B4 C5 D5 E5 - D5 - E5 G5 F#5 D5 E5 C5 B4 G4 A4 F#4 D4 F#4 G4 - G5 -").trim().split(/\s+/);
const BASS=("G2 G2 D2 D2 G2 C3 D2 G2 G2 G2 D2 D2 G2 C3 D2 G2 C3 C3 D3 D3 C3 A2 D3 G2").split(' ');
function scheduler(){
  if(!AC) return;
  while(seqNext<AC.currentTime+0.12){
    if(musicOn) playStep(seqStep,seqNext); else seqStep=0;
    seqNext+=60/tempo/2; if(musicOn) seqStep++;
  }
}
function playStep(i,t){
  const e=60/tempo/2, k=i%MEL.length, n=MEL[k];
  if(n!=='-'){ let len=1; while(MEL[(k+len)%MEL.length]==='-'&&len<4) len++;
    tone(N2F(n),t,e*len*0.95,'square',0.05,musG); tone(N2F(n)*2,t,e*len*0.5,'square',0.012,musG); }
  const half=Math.floor(k/4)%BASS.length, root=N2F(BASS[half]), pat=[1,2,1.5,2][k%4];
  tone(root*pat,t,e*0.9,'triangle',0.16,musG);
  const b=k%8;
  if(b===0||b===4) tone(140,t,0.12,'sine',0.35,musG,45);
  if(b===2||b===6) noise(t,0.12,0.18,2500,'highpass',musG);
  noise(t+e*0.5,0.03,0.05,7000,'highpass',musG);
}
const SFX={

  near(){ if(!AC) return; const t=AC.currentTime; [988,1319,1568].forEach((f,i)=>tone(f,t+i*0.04,0.07,'square',0.05)); },

  power(){ if(!AC) return; const t=AC.currentTime; [523,659,784,1047,1319].forEach((f,i)=>tone(f,t+i*0.05,0.12,'square',0.07)); },
  pepper(){ if(!AC) return; const t=AC.currentTime; tone(200,t,0.5,'sawtooth',0.08,sfxG,1600); noise(t,0.5,0.25,1200,'bandpass'); },
  hat(){ if(!AC) return; const t=AC.currentTime; [784,988,1175].forEach((f,i)=>tone(f,t+i*0.06,0.1,'triangle',0.12)); },

  fanfare(){ if(!AC) return; const t=AC.currentTime; whistle(t,0.6);
    const seq=[['G4',0,.12],['C5',.12,.12],['E5',.24,.12],['G5',.36,.3],['E5',.7,.12],['G5',.82,.6]];
    seq.forEach(([n,o,d])=>{ tone(N2F(n),t+0.6+o,d,'square',0.09); tone(N2F(n)/2,t+0.6+o,d,'triangle',0.15); });
    [0,.15,.3].forEach(o=>tone(N2F('C6'),t+1.5+o,0.1,'square',0.05)); },

  twang(){ if(!AC) return; const t=AC.currentTime; tone(320,t,0.18,'triangle',0.2,sfxG,110); noise(t,0.08,0.2,4000,'highpass'); tone(1800,t+0.02,0.25,'sine',0.03,sfxG,900); },

  aie(){ if(!AC) return; const t=AC.currentTime; tone(900,t,0.2,'square',0.06,sfxG,350); },

function whistle(t,d){ if(!AC) return; const o=AC.createOscillator(), l=AC.createOscillator(), lg=AC.createGain(), gn=AC.createGain();
  o.type='square'; o.frequency.value=2900; l.frequency.value=38; lg.gain.value=160; l.connect(lg).connect(o.frequency);
  gn.gain.setValueAtTime(0.0001,t); gn.gain.linearRampToValueAtTime(0.045,t+0.01); gn.gain.setValueAtTime(0.045,t+d-0.03); gn.gain.linearRampToValueAtTime(0.0001,t+d);
  o.connect(gn).connect(sfxG); o.start(t); l.start(t); o.stop(t+d+0.02); l.stop(t+d+0.02); }
function playPena(){
  if(!AC||!penaBuf) return;
  if(penaSrc){ try{penaSrc.onended=null; penaSrc.stop();}catch(e){} }
  const s=AC.createBufferSource(); s.buffer=penaBuf; s.connect(penaG); s.start();
  penaSrc=s; musG.gain.setTargetAtTime(0.0,AC.currentTime,0.15);
  s.onended=()=>{ if(penaSrc===s){ penaSrc=null; musG.gain.setTargetAtTime(0.42,AC.currentTime,0.4); } };
}
function stopPena(){ if(penaSrc){ try{penaSrc.onended=null;penaSrc.stop();}catch(e){} penaSrc=null; if(AC) musG.gain.setTargetAtTime(0.42,AC.currentTime,0.3);} }

function makeMud(){
  const w=ri(26,42), h=ri(14,22), c=document.createElement('canvas'); c.width=w; c.height=h; const x=c.getContext('2d');
  const cols=['#6b4a2a','#5c3e22','#7d5833','#4e341c'];
  const seed=Math.random()*1000;
  for(let j=0;j<h;j++) for(let i=0;i<w;i++){
    const dx=(i-w/2)/(w/2), dy=(j-h/2)/(h/2), n=hash(i+seed,j)*0.35;
    if(dx*dx+dy*dy<0.8+n){ x.fillStyle= (hash(i*3+seed,j*7)<0.12)?'#9a7448': cols[Math.floor(hash(i,j+seed)*3)]; x.fillRect(i,j,1,1); }
  }
  return {c,w,h};
}
function placeItems(){
  items=[]; muds=[];
  const at=f=>-L*f, rx=()=>rnd(PX0+14,PX1-14);
  items.push({k:'pena',x:rx(),y:at(rnd(.35,.7)),t:0});
  if(level>=3&&Math.random()<.5) items.push({k:'pena',x:rx(),y:at(rnd(.75,.92)),t:0});
  for(let i=0;i<3+Math.min(level,3);i++) items.push({k:'gateau',x:rx(),y:at(rnd(.08,.96)),t:0});
  for(let i=0;i<1+(level>2?1:0);i++) items.push({k:'piment',x:rx(),y:at(rnd(.15,.85)),t:0});
  if(level>=2||Math.random()<.6) items.push({k:'txapela',x:rx(),y:at(rnd(.1,.6)),t:0});
  for(let i=0;i<2+Math.min(level,4);i++){ const m=makeMud(); m.x=rx(); m.y=at(rnd(.1,.95)); muds.push(m); }
}

function spawnDefender(type,x,y){
  const sp=defSpec(type);
  const d={type,sp,x:x!=null?x:rnd(PX0+8,PX1-8),y:y!=null?y:camY-14,vx:0,vy:0,phase:rnd(0,6),state:'run',t:0,counted:false,

  if(type==='ailier'){ d.y=camY+20; d.state='aim'; d.t=0.75; }

}
function spawnWave(){
  const r=Math.random(), aw=.12+.03*level;
  if(level>=2&&r<.16){ // defensive line with a gap
    const n=ri(3,4), gap=ri(0,n), span=(PX1-PX0-20)/(n+1);
    for(let i=0;i<=n;i++) if(i!==gap) spawnDefender(pick(['centre','pilier','demi']),PX0+10+span*(i+0.5),camY-14-ri(0,6));
    return 2.2;
  }
  const q=Math.random();
  spawnDefender(q<aw?'ailier':q<aw+.3?'demi':q<aw+.62?'centre':'pilier');
  return 1;
}
function spawnSpecial(){
  if(defs.some(d=>d.special)) return;
  let kind=Math.random()<.5?'indien':'koxka'; if(kind===lastSpecial&&Math.random()<.7) kind=kind==='indien'?'koxka':'indien'; lastSpecial=kind;
  const d=spawnDefender(kind, kind==='indien'?pick([PX0+14,PX1-14,rnd(PX0+30,PX1-30)]):undefined);

function dropBomb(){

function addPop(x,y,s,c,big){ pops.push({x,y,s,c:c||'#fff',t:0,big:!!big}); }

/* ================= UPDATE ================= */
function update(dt){
  gT+=dt; if(!S.paused) S.t+=dt;
  excite+=(0.25-excite)*Math.min(1,dt*0.6);
  if(shake>0) shake=Math.max(0,shake-dt*25);
  if(AC&&crowdG) crowdG.gain.setTargetAtTime(S.mode==='title'?0.02:0.025+excite*0.13,AC.currentTime,0.25);
  if(S.mode==='title'){ musicOn=true; camY=-170-gT*12%400; updateBubbles(dt); return; }
  if(S.paused) return;
  if(S.mode==='countdown'){
    const step=Math.floor(S.t/0.7);
    if(step!==S.cdStep){ S.cdStep=step; if(step<3) SFX.beep(); else if(step===3){ SFX.go(); excite=0.9; SFX.cheer(0.35);} }
    if(step>=3){ setMode('play'); musicOn=true; banner={text:'ALLEZ !',col:'#ffd400',t:0,dur:0.8,size:24}; }
    updateBubbles(dt); updateParts(dt);
    return;
  }
  if(S.mode==='play') updatePlay(dt);
  else if(S.mode==='try') updateTry(dt);
  else if(S.mode==='over'){ updateParts(dt); updateBubbles(dt); for(const d of defs) animDef(d,dt,true); }
  if(banner){ banner.t+=dt; if(banner.t>banner.dur) banner=null; }
}

function updatePlay(dt){
  levelT+=dt;
  // ---- player ----
  if(P.state==='run'){
    let ix=(K.ArrowRight?1:0)-(K.ArrowLeft?1:0)+T.x, iy=(K.ArrowDown?1:0)-(K.ArrowUp?1:0)+T.y;
    const m=Math.hypot(ix,iy); if(m>1){ix/=m;iy/=m;}
    const want=K.Space||T.sprint;
    let sprint=false;
    if(P.pepper>0){ sprint=want||true; }
    else if(want&&!P.tired&&m>0.1){ sprint=true; P.stam=Math.max(0,P.stam-dt*0.36); if(P.stam<=0) P.tired=true; }
    if(!sprint||P.pepper>0){ P.stam=Math.min(1,P.stam+dt*(want?0.08:0.3)); if(P.tired&&P.stam>0.35) P.tired=false; }
    P.mud=muds.some(md=>inMud(md,P.x,P.y));
    const base=80*(P.pepper>0?1.7:(sprint&&!P.pepper?2:1))*(P.mud?0.5:1)*(P.power>0?1.15:1);
    P.vx+=(ix*base-P.vx)*Math.min(1,dt*12); P.vy+=(iy*base-P.vy)*Math.min(1,dt*12);
    P.x=clamp(P.x+P.vx*dt,PX0+4,PX1-4);
    P.y=clamp(P.y+P.vy*dt,tryY-40,camY+H-12);
    const spd=Math.hypot(P.vx,P.vy); P.phase+=dt*spd/5.5;
    if(spd>100&&Math.random()<dt*30) parts.push({x:P.x+rnd(-4,4),y:P.y,vx:rnd(-10,10),vy:rnd(10,30),life:.35,max:.35,c:P.mud?'#6b4a2a':'#9fd88a',g:0,s:1});
    if(P.pepper>0&&Math.random()<dt*60) parts.push({x:P.x+rnd(-4,4),y:P.y-rnd(0,6),vx:rnd(-15,15),vy:rnd(20,50),life:.4,max:.4,c:pick(['#ffd400','#ff8a1e','#ff3a1a']),g:0,s:2});
    if(P.power>0&&Math.random()<dt*40) parts.push({x:P.x+rnd(-8,8),y:P.y-rnd(0,22),vx:rnd(-10,10),vy:rnd(-30,-10),life:.5,max:.5,c:pick(['#ffd400','#fff27a','#ffffff']),g:0,s:1});
    if(P.mud&&spd>20&&Math.random()<dt*8) SFX.mud();
    if(P.y<tryY-3){ scoreTry(); return; }
  } else if(P.state==='down'){
    P.downT-=dt;
    if(P.downT<=0){
      if(lives<=0){ gameOver(); return; }
      P.state='run'; P.inv=2.0; P.soot=0;
      for(const d of defs) if(Math.hypot(d.x-P.x,d.y-P.y)<52 && d.state!=='fly') { d.state='fly'; d.vx=(d.x-P.x)*2; d.vy=(d.y-P.y)*2-20; d.vz=90; d.spin=rnd(-6,6); }
    }
  }
  P.inv=Math.max(0,P.inv-dt); P.pepper=Math.max(0,P.pepper-dt); P.power=Math.max(0,P.power-dt);
  // ---- camera ----
  const target=P.y-165; camY+=(target-camY)*Math.min(1,dt*5); camY=Math.max(camY,tryY-82);
  // ---- spawns ----
  if(camY-14>tryY+30){
    spawnT-=dt*(P.state==='run'?1:0.3);
    if(spawnT<=0){ const k=spawnWave(); spawnT=Math.max(0.36,1.05-0.09*(level-1))*rnd(.7,1.3)*k; }
    specialT-=dt;
    if(specialT<=0&&P.state==='run'){ spawnSpecial(); specialT=rnd(13,19); }
    bombT-=dt;
    if(bombT<=0&&P.state==='run'){ dropBomb(); bombT=Math.max(2.4,7-0.8*(level-1))*rnd(.7,1.3); }
  }
  // ---- defenders ----
  for(const d of defs) animDef(d,dt,false);
  defs=defs.filter(d=>d.y<camY+H+40&&d.y>camY-80&&d.x>20&&d.x<300);
  // ---- bombs ----
  for(const b of bombs){
    if(b.state==='fall'){ b.vz-=420*dt; b.z+=b.vz*dt; if(b.z<=0){ b.z=0; b.state='lit'; SFX.thud(); burst(b.x,b.y,6,['#9fd88a','#5aa04a'],30,.3); } }
    else { b.fuse-=dt; if(Math.floor(b.fuse*8)!==b.lastTick){ b.lastTick=Math.floor(b.fuse*8); if(b.fuse<0.8) SFX.tick(); }
      if(P.state==='run'&&Math.hypot(b.x-P.x,b.y-P.y)<9) b.fuse=0;
      if(b.fuse<=0) explode(b); }
  }
  bombs=bombs.filter(b=>!b.dead);
  // ---- arrows ----
  for(const a of arrows){
    a.life-=dt; a.x+=a.vx*dt; a.y+=a.vy*dt;
    if(a.x<PX0-10||a.x>PX1+10) a.life=0;
    if(a.life<=0) continue;
    if(P.state==='run'&&Math.abs(a.x-P.x)<5&&Math.abs(a.y-(P.y-10))<9){
      a.life=0;
      if(P.power>0){ addPop(P.x,P.y-26,'TCHAC !','#ffd400'); burst(a.x,a.y,8,['#8a5a2a','#fff'],40,.3); SFX.pop(); }
      else if(P.inv>0){ a.life=0.01; }
      else if(P.shield){ P.shield=false; P.inv=1.3; SFX.shieldBreak(); addPop(P.x,P.y-28,'TXAPELA !','#fff'); }
      else hurt('OUCH !','UNE FLÈCHE !',Math.PI/2);
      continue;
    }
    for(const d of defs){ if(d.special||!(d.state==='run'||d.state==='dash')) continue;
      if(Math.abs(a.x-d.x)<d.sp.w/2+1&&Math.abs(a.y-(d.y-10))<9){ a.life=0; d.state='down'; d.t=1.3; d.counted=true; d.ang=Math.PI/2;
        const pts=20*mult(); score+=pts; addPop(d.x,d.y-20,'AÏE ! +'+pts,'#ffd400'); SFX.aie(); break; } }
  }
  arrows=arrows.filter(a=>a.life>0);
  // ---- items ----

function animDef(d,dt,frozen){

  d.t-=dt;
  if(frozen&&d.state!=='fly'){ d.vx*=0.9; d.vy*=0.9; d.x+=d.vx*dt; d.y+=d.vy*dt; return; }
  switch(d.state){
    case 'aim':
      if(d.t<=0){ d.state='dash'; const dx=P.x-d.x, dy=Math.max(40,(P.y+20)-d.y), n=Math.hypot(dx,dy); const v=TYPES.ailier.v*m; d.vx=dx/n*v; d.vy=dy/n*v; SFX.pop(); }

      break; }
    case 'run': {
      const T0=TYPES[d.type]; let tvx=0;

      if(d.type==='koxka'){ d.z=Math.abs(Math.sin(gT*9+d.zig))*4;
        const gap=P.y-d.y; if(!d.leapt&&P.state==='run'&&gap<50&&gap>18){ d.leapt=true; d.state='leap'; d.t=0.55;

      if(d.type==='demi') tvx+=Math.sin(gT*5+d.zig)*55;
      d.vx+=(tvx*m-d.vx)*Math.min(1,dt*4);
      d.vy+=(T0.v*m-d.vy)*Math.min(1,dt*3);
      break; }
    case 'dive': d.vx*=Math.pow(0.02,dt); d.vy*=Math.pow(0.02,dt); if(d.t<=0){ d.state='down'; d.t=1.1; } break;
    case 'down': d.vx=0; d.vy=0; if(d.t<=0){ d.state='run'; d.counted=true; } break;
    case 'fly': d.vz-=320*dt; d.z+=d.vz*dt; d.ang+=d.spin*dt; if(d.z<=0&&d.vz<0){ d.z=0; d.state='down'; d.t=1.4; d.counted=true; d.ang=d.spin>0?Math.PI/2:-Math.PI/2; burst(d.x,d.y,6,['#9fd88a','#fff'],30,.3);} break;
  }
  d.x+=d.vx*dt; d.y+=d.vy*dt;
  if(d.state==='run') d.x=clamp(d.x,PX0,PX1);
  d.phase+=dt*Math.hypot(d.vx,d.vy)/5;
  if(frozen||S.mode!=='play') return;
  // collision
  if(P.state==='run'&&(d.state==='run'||d.state==='dash'||d.state==='aim'||d.state==='bow'||(d.state==='leap'&&d.z<5))){

        parts.push({x:P.x,y:P.y-20,vx:rnd(-30,30),vy:-60,life:1,max:1,c:'#1c1c28',g:120,s:4}); }

      return;
    }

  // dodge counting
  if(!d.counted&&P.state!=='run'&&d.y>P.y+7) d.counted=true;

    }
  }
}

  document.body.classList.toggle('touch',v);
  togBtn.textContent='TACTILE : '+(v?'ON':'OFF'); togBtn.setAttribute('aria-pressed',String(v));
  const h=document.getElementById('splash-hint'); if(h) h.textContent=v?'TOUCHE L\'ÉCRAN':'APPUIE SUR UNE TOUCHE';
  T.id=null; T.sid=null; T.active=false; T.x=T.y=0; T.sprint=false;
  setTimeout(fit,0);
}
togBtn.addEventListener('click',e=>{ setTouchUI(!touchUI); togBtn.blur(); cv.focus(); });
document.getElementById('rotate').addEventListener('pointerdown',e=>{ e.preventDefault(); document.body.classList.add('rot-ok'); });
const inR=(p,r)=>p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h;
let triedFull=false;
function goFull(){ if(triedFull) return; triedFull=true;
  try{ const el=document.documentElement, rq=el.requestFullscreen||el.webkitRequestFullscreen;
    if(rq){ const pr=rq.call(el); if(pr&&pr.then) pr.then(()=>{ try{ screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape').catch(()=>{}); }catch(e){} }).catch(()=>{}); } }catch(e){} }
function drawTouchUI(){
  if(!touchUI) return;
  // pause button
  g.fillStyle='rgba(8,10,24,0.75)'; g.fillRect(PAUSEBTN.x,PAUSEBTN.y,PAUSEBTN.w,PAUSEBTN.h);
  g.fillStyle='#fff'; g.fillRect(PAUSEBTN.x+5,PAUSEBTN.y+3,2,8); g.fillRect(PAUSEBTN.x+9,PAUSEBTN.y+3,2,8);
  // joystick
  const jx=T.active?T.ox:JOY_HOME.x, jy=T.active?T.oy:JOY_HOME.y;
  g.globalAlpha=T.active?0.9:0.55;
  g.fillStyle='rgba(8,10,24,0.55)'; g.beginPath(); g.arc(jx,jy,18,0,Math.PI*2); g.fill();
  g.strokeStyle='#ffffff'; g.lineWidth=1; g.beginPath(); g.arc(jx,jy,18,0,Math.PI*2); g.stroke();
  g.fillStyle='#ffffff';
  g.fillRect(jx-1,jy-15,3,2); g.fillRect(jx-1,jy+13,3,2); g.fillRect(jx-15,jy-1,2,3); g.fillRect(jx+13,jy-1,2,3);
  const kx=Math.round(jx+T.x*12), ky=Math.round(jy+T.y*12);
  g.fillStyle='#4fb3ff'; g.beginPath(); g.arc(kx,ky,7,0,Math.PI*2); g.fill(); g.fillStyle='#bfe4ff'; g.fillRect(kx-3,ky-4,3,2);
  // sprint button
  g.globalAlpha=T.sprint?0.95:0.6;
  g.fillStyle=T.sprint?'rgba(255,212,0,0.85)':'rgba(8,10,24,0.6)'; g.beginPath(); g.arc(SPR.x,SPR.y,SPR.r,0,Math.PI*2); g.fill();
  g.strokeStyle='#ffd400'; g.beginPath(); g.arc(SPR.x,SPR.y,SPR.r,0,Math.PI*2); g.stroke();
  txt('x2',SPR.x+1,SPR.y-8,T.sprint?'#1a1200':'#ffd400',16,'center',false);
  g.globalAlpha=1;
  txt('SPRINT',SPR.x,SPR.y+SPR.r+3,'#ffd400',8,'center');
}

/* ================= INPUT ================= */
const K={};
addEventListener('keydown',e=>{
  const k=e.code;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(k)) e.preventDefault();
  if(!K[k]) onPress(k);
  K[k]=true;
},{passive:false});
addEventListener('keyup',e=>{ K[e.code]=false; });
function autoPause(){ for(const k in K) K[k]=false; if((S.mode==='play'||S.mode==='countdown')&&!S.paused) setPaused(true); }
addEventListener('blur',autoPause);
document.addEventListener('visibilitychange',()=>{ if(document.hidden) autoPause(); });
function onPress(k){
  initAudio();
  if(splashOn){ hideSplash(); return; }
  if(k==='KeyM'){ setMute(!muted); return; }
  if(k==='KeyT'){ setTouchUI(!touchUI); return; }
  const go=k==='Space'||k==='Enter';
  if(S.mode==='title'&&go) newGame();
  else if(S.mode==='over'&&S.t>1.2&&go) newGame();
  else if(S.mode==='try'&&S.t>2.2&&go) nextLevel();
  else if((S.mode==='play'||S.mode==='countdown')&&(k==='KeyP'||k==='Escape')) setPaused(!S.paused);
  else if(S.paused&&go) setPaused(false);
}
const T={x:0,y:0,sprint:false,id:null,sid:null,ox:0,oy:0,active:false};
function toGame(e){ const r=cv.getBoundingClientRect(); return {x:(e.clientX-r.left)/r.width*W, y:(e.clientY-r.top)/r.height*H}; }
let splashOn=true;
const splash=document.getElementById('splash');
function hideSplash(){ if(!splashOn) return; splashOn=false; splash.classList.add('out'); setTimeout(()=>{splash.hidden=true;},650); cv.focus(); }
splash.addEventListener('pointerdown',e=>{ e.preventDefault(); initAudio(); hideSplash(); });
setTimeout(hideSplash,4200);
cv.addEventListener('pointerdown',e=>{
  e.preventDefault(); cv.focus(); initAudio(); const p=toGame(e);
  if(S.mode==='title'&&inR(p,TOG)){ setTouchUI(!touchUI); return; }
  if(touchUI&&e.pointerType!=='mouse') goFull();
  if(S.mode==='title'){ newGame(); return; }
  if(S.mode==='over'){ if(S.t>1.2) newGame(); return; }
  if(S.mode==='try'){ if(S.t>2.2) nextLevel(); return; }
  if(S.paused){ setPaused(false); return; }
  if(!touchUI) return;
  if(inR(p,PAUSEBTN)){ setPaused(true); return; }
  if(p.x>W*0.62&&T.sid===null){ T.sid=e.pointerId; T.sprint=true; }
  else if(T.id===null){ T.id=e.pointerId; T.ox=p.x; T.oy=p.y; T.active=true; T.x=T.y=0; }
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
});
cv.addEventListener('pointermove',e=>{ if(e.pointerId!==T.id) return; const p=toGame(e); let dx=(p.x-T.ox)/14, dy=(p.y-T.oy)/14; const m=Math.hypot(dx,dy); if(m>1){dx/=m;dy/=m;} if(m<0.18){dx=0;dy=0;} T.x=dx; T.y=dy; });
function endPtr(e){ if(e.pointerId===T.id){ T.id=null; T.active=false; T.x=T.y=0; } if(e.pointerId===T.sid){ T.sid=null; T.sprint=false; } }
cv.addEventListener('pointerup',endPtr); cv.addEventListener('pointercancel',endPtr);

/* ================= LOOP ================= */
let last=performance.now();
function frame(now){
  const dt=Math.min(0.033,(now-last)/1000); last=now;
  update(dt); draw();
  requestAnimationFrame(frame);
}
function start(){ setTouchUI(touchUI); P={x:160,y:0,vx:0,vy:0,phase:0,stam:1,state:'run',sp:POT,inv:0,pepper:0,power:0}; requestAnimationFrame(t=>{last=t;frame(t);}); cv.focus(); }
const fontReady=document.fonts&&document.fonts.load?Promise.race([document.fonts.load('8px "Press Start 2P"'),new Promise(r=>setTimeout(r,1500))]):Promise.resolve();
fontReady.then(start,start);
</script>
